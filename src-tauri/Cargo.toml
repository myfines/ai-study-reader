[package]
name = "ai-study-reader"
version = "0.1.0"
description = "Offline-first PDF and TXT annotation reader"
authors = ["AI Study Reader contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "ai_study_reader_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3.0"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
keyring = { version = "3.6", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
